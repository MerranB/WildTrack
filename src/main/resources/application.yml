spring:
  application:
    name: wildtrack

movebank:
  username: ${MOVEBANK_USERNAME}
  password: ${MOVEBANK_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  threads:
    virtual:
      enabled: true

server:
  port: 8080
  servlet:
    context-path: /

app:
  wildtrack-api:
    base-url: https://api.wildtrack.com

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%t] %-5level %logger{36}.%M -- %msg%n"