spring:
  application:
    name: wildtrack
  datasource:
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${EMAIL_HOST}
    port: ${EMAIL_PORT}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  threads:
    virtual:
      enabled: true

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-haiku-4-5-20251001
    model:
      chat: anthropic

movebank:
  username: ${MOVEBANK_USERNAME}
  password: ${MOVEBANK_PASSWORD}

server:
  port: 8080
  servlet:
    context-path: /

scheduler:
  cronTime:
    updateDatabase: "0 30 21 * * ?"
    geoFence: "0 30 23 * * ?"
  enabled: true

app:
  wildtrack-api:
    base-url: https://api.wildtrack.com

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%t] %-5level %logger{36}.%M -- %msg%n"

api:
  key: ${KEY}