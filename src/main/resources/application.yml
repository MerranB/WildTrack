spring:
  application:
    name: wildtrack
  datasource:
    hikari:
      maximum-pool-size: 20
  data:
    web:
      pageable:
       default-page-size: 20
       max-page-size: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${EMAIL_HOST}
    port: ${EMAIL_PORT}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  threads:
    virtual:
      enabled: true

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-haiku-4-5-20251001
          temperature: 0.1
    model:
      chat: anthropic
wildtrack:
  security:
    admin:
      username: ${WILDTRACK_ADMIN_USERNAME}
      password: ${WILDTRACK_ADMIN_PASSWORD}
    jwt:
      secret: ${WILDTRACK_JWT_SECRET}
      expiry-minutes: 15
    lockout:
      max-attempts: 5
      duration-minutes: 60
  verification:
    code-expiry-minutes: 15
    max-attempts: 5
  study-ids:
    - 19186107
    - 1073231887
    - 2970193504
tiles:
  raw-min-zoom: 11
  cells-per-tile: 64

hotspots:
  grid-size: 10
  max-cells: 30

server:
  port: 8080
  servlet:
    context-path: /

scheduler:
  cronTime:
    updateDatabase: "0 30 21 * * ?"
    geoFence: "0 30 23 * * ?"
  enabled: true
logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%t] %-5level %logger{36}.%M -- %msg%n"
cors:
  allowed-origins: http://localhost:5173,https://merranb.github.io,https://thewildtrack.org
